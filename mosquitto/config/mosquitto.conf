# ---------------------------------------------------------------------------
# Mosquitto 2.x refuses remote connections unless a listener is declared.
# Without this file the container starts, looks healthy, and still rejects
# every client. That is the single most common surprise with this image.
# ---------------------------------------------------------------------------

listener 1883
allow_anonymous true

# Optional second listener for browser-based MQTT clients.
listener 9001
protocol websockets

# Persist retained messages and queued QoS 1/2 messages to the named volume,
# so they survive a container restart.
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
